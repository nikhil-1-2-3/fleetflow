apiVersion: apps/v1
kind: Deployment
metadata:
  name: renthere-backend
  labels:
    app: renthere-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: renthere-backend
  template:
    metadata:
      labels:
        app: renthere-backend
    spec:
      containers:
      - name: backend-container
        image: singhnikhil212/renthere-backend:latest
        ports:
        - containerPort: 5000
        env:
        # TODO: In production, these should be securely injected via K8s Secrets
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        # - name: MONGO_URI
        #   value: "your-mongodb-connection-string"
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
